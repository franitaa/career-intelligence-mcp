[project]
name = "career-intelligence-mcp"
version = "0.1.0"
description = "MCP server scaffold for career and research intelligence"
readme = "README.md"
authors = [
    { name = "franitaa", email = "frondinella@itba.edu.ar" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
